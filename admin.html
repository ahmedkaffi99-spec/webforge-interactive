<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIT26 Admin</title><style>body{background:#080b12;color:#f4f6fb;font:15px system-ui;margin:0;padding:20px}main{max-width:1100px;margin:auto}input,button{padding:12px;background:#111824;color:white;border:1px solid #293446;border-radius:8px;margin:5px}button{cursor:pointer;background:#d7f5ff;color:#07101b;font-weight:800}table{width:100%;border-collapse:collapse;margin-top:20px}td,th{text-align:left;padding:12px;border-bottom:1px solid #273040}.panel{border:1px solid #273040;padding:16px;border-radius:12px;margin-top:20px}#status{color:#9be7ff}</style></head><body><main><h1>KIT26 Admin</h1><p id="status">Connect Supabase and sign in with an admin account.</p><section class="panel"><h2>Admin login</h2><form id="login"><input name="email" type="email" placeholder="Admin email" required><input name="password" type="password" placeholder="Password" required><button>Sign in</button></form><button id="logout">Sign out</button></section><section class="panel"><h2>Orders</h2><button id="refresh">Refresh</button><table><thead><tr><th>Date</th><th>Customer</th><th>Order ID</th><th>Total</th><th>Status</th></tr></thead><tbody id="orders"></tbody></table></section><section class="panel"><h2>Products</h2><table><thead><tr><th>Product</th><th>Price</th><th>Stock</th><th>Active</th></tr></thead><tbody id="products"></tbody></table></section></main><script type="module" src="/src/admin.js"></script></body></html>
